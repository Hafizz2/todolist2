# Local development: MySQL 8 + PHP-Apache for the Mini App.
# The bot runs on the host (python -m zikr_bot) and connects to MySQL on localhost:3306.
# db/*.sql files run automatically, in name order, the first time the volume is created.
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: zikr_circle
      MYSQL_USER: zikr
      MYSQL_PASSWORD: zikr
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uzikr", "-pzikr"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: ./docker/php
    ports:
      - "8080:80"
    volumes:
      - ./miniapp:/var/www/html
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
