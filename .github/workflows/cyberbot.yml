name: CyberBuddy

# Times are UTC. Defaults are for India (IST = UTC+5:30):
#   02:21 UTC = 07:51 IST  -> morning lesson
#   14:21 UTC = 19:51 IST  -> evening check-in
#   :47 every hour 03-18 UTC (08:17-23:47 IST) -> answer your commands (/done, /challenge ...)
on:
  schedule:
    - cron: "21 2 * * *"
    - cron: "21 14 * * *"
    - cron: "47 3-18 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options: [morning, evening, sync]
        default: morning

permissions:
  contents: write   # the bot commits cyberbot/state.json to remember your progress

concurrency:
  group: cyberbot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pick mode
        id: mode
        run: |
          case "${{ github.event.schedule }}" in
            "21 2 * * *")  echo "mode=morning" >> "$GITHUB_OUTPUT" ;;
            "21 14 * * *") echo "mode=evening" >> "$GITHUB_OUTPUT" ;;
            "")            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT" ;;
            *)             echo "mode=sync" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run CyberBuddy
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_TZ: ${{ vars.BOT_TZ || 'Asia/Kolkata' }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python3 cyberbot/bot.py ${{ steps.mode.outputs.mode }}

      - name: Save progress
        run: |
          git config user.name "cyberbuddy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cyberbot/state.json
          git diff --cached --quiet && exit 0
          git commit -m "cyberbot: update progress [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
